[project]
name = "osbng"
version = "0.4.0"
description = "A Python package supporting geospatial grid indexing and interaction with Ordnance Survey's British National Grid index system"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Steve Kingston", email = "steve.kingston@os.uk"}, 
    {name = "Kate New", email = "kate.new@os.uk"},
    {name = "Tom Peterken", email = "tom.peterken@os.uk"},
    {name = "Chris Jochem", email = "chris.jochem@os.uk"}
]
keywords = [
    "geospatial", 
    "gis",
    "grid",
    "indexing",
    "spatial"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS"
]
requires-python = ">=3.10, <3.14"
dependencies = ["shapely >=2.0.0"]

[project.optional-dependencies]
docs = [
    "pydata-sphinx-theme >= 0.16",
    "nbsphinx >= 0.9",
    "sphinx >= 8.2",
    "sphinx-copybutton >= 0.5"
]
geopandas = ["geopandas >= 1.0.0"]
test = [
    "pytest",
    "tox",
    "geopandas >= 1.0.0",
    "coverage"
]
all = [
    "geopandas >= 1.0.0",
    "matplotlib",
    "pytest",
    "tox"
]

[build-system]
requires = [
    "setuptools >=77.0.3", # Ensure support for PEP 639 license metadata
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.tox]
requires = ["tox>=4.26.0"]
envlist = [
    "3.10",
    "3.11",
    "3.12",
    "3.13"
]
skip_missing_interpreters = false

[tool.ruff.lint]
select = [
    # flake8-annotations
    # Checks for missing or incorrect type annotations
    "ANN",
    # pydocstyle
    # Checks for docstring conventions and formatting
    "D",
    # pycodestyle
    # Checks for general Python style issues
    "E",
    # pyflakes
    # Checks for logical errors like unused imports, undefined names etc
    "F",
    # isort
    # Checks for import sorting and grouping
    "I",
    ]
# Ignore specific rules
ignore = [
    # missing-return-type-special-method
    "ANN204"
]
# Exclude directories and files
exclude = [
    "__pycache__/",
    ".ruff_cache/",
    ".pytest_cache/",
    ".tox/",
    "*.env",
    "build/",
    "dist/",
    "*.egg-info/"
]

[tool.ruff.lint.pydocstyle]
# Use Google-style convention for docstrings
convention = "google"

[tool.ruff.format]
docstring-code-format = true
